# Local Postgres for integration tests. Port 5433 so it doesn't clash with
# other projects' Postgres on 5432.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: traininghub
      POSTGRES_PASSWORD: traininghub
      POSTGRES_DB: traininghub_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traininghub -d traininghub_test"]
      interval: 2s
      timeout: 3s
      retries: 15
